name: Build Sanggah Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Create Capacitor Android wrapper
        run: |
          mkdir -p android-wrapper/www
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.sanggahgedepanrengen.app",
            "appName": "Sanggah Keluarga",
            "webDir": "www",
            "server": {
              "url": "https://sanggah-keluarga-besar.vercel.app",
              "cleartext": false,
              "allowNavigation": [
                "sanggah-keluarga-besar.vercel.app",
                "*.supabase.co"
              ]
            }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sanggah Keluarga</title></head>
            <body><p>Menghubungkan ke Sanggah Gede Pan Rengen...</p></body>
          </html>
          EOF
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanggah-keluarga-android-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
