name: Build SANGGAH GPR Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Use the exact embedded emblem from the website's logo-sanggah.svg as the launcher icon.
      - name: Create Capacitor Android wrapper
        run: |
          mkdir -p android-wrapper/www android-wrapper/assets
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7 @capacitor/assets sharp
          node -e 'const fs=require("fs");const svg=fs.readFileSync("../logo-sanggah.svg","utf8");const m=svg.match(/href="data:image\/webp;base64,([^"]+)"/);if(!m)throw new Error("Logo WebP embedded in logo-sanggah.svg not found");require("sharp")(Buffer.from(m[1],"base64")).resize(1024,1024,{fit:"contain",background:"#173d32"}).png().toFile("assets/icon.png").then(()=>console.log("Website logo extracted and saved as Android icon"));'
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "id.sanggahgedepanrengen.app",
            "appName": "SANGGAH GPR",
            "webDir": "www",
            "server": {
              "url": "https://sanggah-keluarga-besar.vercel.app",
              "cleartext": false,
              "allowNavigation": [
                "sanggah-keluarga-besar.vercel.app",
                "*.supabase.co"
              ]
            }
          }
          EOF
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SANGGAH GPR</title></head>
            <body><p>Menghubungkan ke SANGGAH GPR...</p></body>
          </html>
          EOF
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanggah-gpr-android-apk
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
